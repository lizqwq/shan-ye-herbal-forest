  <!-- 纯计算模块独立于 Three.js；便于测试手势阈值。没有使用 landmark.z 控速。 -->
  <script id="gesture-math">
  const GestureMath = (() => {
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const smoothstep = (lo, hi, x) => { const t = clamp((x - lo) / (hi - lo), 0, 1); return t * t * (3 - 2 * t); };
    const alpha = (rate, dt) => 1 - Math.exp(-rate * dt);
    function jointAngle(a, b, c) {
      const ux = a.x - b.x, uy = a.y - b.y, vx = c.x - b.x, vy = c.y - b.y;
      return Math.acos(clamp((ux * vx + uy * vy) / Math.max(1e-8, Math.hypot(ux, uy) * Math.hypot(vx, vy)), -1, 1)) * 180 / Math.PI;
    }
    function extended(lm, mcp, pip, tip) {
      return jointAngle(lm[mcp], lm[pip], lm[tip]) > 150 && distance(lm[tip], lm[0]) > distance(lm[pip], lm[0]) * 1.08;
    }
    function classify(lm) {
      const palmSize = Math.max(0.025, distance(lm[0], lm[9]));
      const index = extended(lm, 5, 6, 8), middle = extended(lm, 9, 10, 12);
      const ring = extended(lm, 13, 14, 16), pinky = extended(lm, 17, 18, 20);
      const othersFolded = !middle && !ring && !pinky;
      const thumbOpen = distance(lm[4], lm[5]) / palmSize > 0.85 && distance(lm[4], lm[17]) / palmSize > 1.25;
      const gap = distance(lm[4], lm[8]) / palmSize; // 以掌长归一化，靠近镜头本身不触发缩放。
      const pointing = index && othersFolded && !thumbOpen && lm[8].y < lm[6].y - 0.015 && gap > 0.55;
      const zooming = othersFolded && thumbOpen;
      const openPalm = [index, middle, ring, pinky].filter(Boolean).length >= 3;
      const ok = distance(lm[4], lm[8]) / palmSize < 0.38 && middle && ring && pinky;
      // 允许拇指自然搭在拳外、一个手指略松；避免将指向或 OK 误判为拳。
      const fist = !index && [index,middle,ring,pinky].filter(v=>!v).length >= 3 && !ok;
      return { ok, fist, palmSize, gap, mode: zooming ? 'zoom' : pointing ? 'point' : openPalm ? 'rotate' : 'brake' };
    }
    function sensitivity(palmSize, scale) {
      return lerp(2.1, 7.2, smoothstep(0.065, 0.27, palmSize)) / Math.pow(Math.max(scale, 0.3), 0.8);
    }
    function stepDwell(dwell, tip, speed, now, cooldownUntil, config) {
      if (!dwell.anchor || distance(tip, dwell.anchor) > config.anchorRadius) {
        return { anchor: { ...tip }, frames: 1, started: now, latched: false, progress: 0, fire: false };
      }
      if (speed > config.maxSpeed) {
        return { ...dwell, anchor: { ...tip }, frames: 0, started: now, progress: 0, fire: false };
      }
      const frames = dwell.frames + 1;
      const progress = Math.min(frames / config.frames, (now - dwell.started) / config.duration, 1);
      const fire = !dwell.latched && progress >= 1 && now >= cooldownUntil;
      return { ...dwell, frames, progress, fire, latched: dwell.latched || fire };
    }
    function twoHandScale(startScale, ratio, minScale, maxScale) {
      const stableRatio = Math.abs(ratio-1)<0.02 ? 1 : ratio;
      return clamp(startScale*Math.pow(Math.max(.1,stableRatio),1.25),minScale,maxScale);
    }
    function advanceGrab(previous,pose,inside,now) {
      const fresh=()=>({phase:0,hold:0,deadline:0,progress:0,fire:false});
      if(previous.phase===3)return {...previous,fire:false};
      // 入口附近连续握拳 500ms 即进入；松拳或离开立即清零。
      if(!inside)return fresh();
      if(pose!=='fist'){if(previous.phase===1 && now-(previous.lastFist||0)<=150)return {...previous,fire:false};return fresh();}
      const hold=previous.hold || now;
      const progress=clamp((now-hold)/500,0,1);
      return {phase:progress>=1?3:1,hold,deadline:0,lastFist:now,progress,fire:progress>=1};
    }
    return { clamp, lerp, distance, alpha, classify, sensitivity, stepDwell, twoHandScale, advanceGrab };
  })();
  </script>

  <script>
  'use strict';
  // 可调整项：经纬度基准取决于 GLB 的建模朝向；本模型没有命名的大陆子节点。

    markerLift: 0.022,           // 从模型采样估计主体表面，标记轻微抬高，避免漂在云层之外。
    minScale: 0.65, maxScale: 1.65,
    homeDistance: 3.7, focusDistance: 2.02,
    palmSmooth: 0.42, pointerSmooth: 0.48, depthSmooth: 0.16,
    brakeSpeed: 0.03, maxAngularSpeed: 2.8,
    handTimeout: 280, clickCooldown: 1400,
    dwell: { frames: 14, duration: 550, anchorRadius: 0.028, maxSpeed: 0.14 },
    inferenceFPS: 30
  };
  const BOARDS = [
    { id: 'asia', name: '亚洲', lat: 34, lon: 105, aliases: ['Asia', '亚洲'] },
    { id: 'europe', name: '欧洲', lat: 51, lon: 15, aliases: ['Europe', '欧洲'] },
    { id: 'africa', name: '非洲', lat: 5, lon: 23, aliases: ['Africa', '非洲'] },
    { id: 'north-america', name: '北美洲', lat: 45, lon: -105, aliases: ['NorthAmerica', 'North_America', '北美洲'] },
    { id: 'south-america', name: '南美洲', lat: -18, lon: -60, aliases: ['SouthAmerica', 'South_America', '南美洲'] },
    { id: 'oceania', name: '大洋洲', lat: -25, lon: 135, aliases: ['Oceania', 'Australia', '大洋洲'] },
    { id: 'antarctica', name: '南极洲', lat: -78, lon: 0, aliases: ['Antarctica', '南极洲'] }
  ];
  const state = {
    ui: { entered: false, enterRequested: false, grab: {phase:0,hold:0,deadline:0,fire:false}, scrollTarget: 0, scrollVelocity: 0, modal: null, previousFocus: null, returnRequested: false, okStarted: 0, okLatched: false, hover: null, dwellKey: null, tutorial: true, tutorialStarted: null, tutorialStep: -1 },
    ready: false, surfaceRadius: 0.8, handPresent: false, handMode: 'none', lastHandAt: 0, lastSampleAt: 0,
    palm: null, palmPointer: null, fistDetected: false, tip: null, palmSize: 0.12, sensitivity: 3,
    velocity: { x: 0, y: 0 }, targetVelocity: { x: 0, y: 0 },
    scale: 1, scaleTarget: 1, zoomStartGap: null, zoomStartScale: 1, pairGap: null, pairStartGap: null, pairStartScale: 1, handCount: 0,
    dwell: { anchor: null, frames: 0, started: 0, latched: false, progress: 0 },
    cooldownUntil: 0, clicks: [], pointerNDC: { x: 0, y: 0 },
    view: { distance: CONFIG.homeDistance, targetDistance: CONFIG.homeDistance, transition: null, selectedBoard: null },
    camera: { helper: null, hands: null, starting: false, running: false, busy: false, frameReady: false, lastVideoTime: -1, lastInference: 0, failures: 0, session: 0 },
    latestResults: null, resultsRevision: 0, drawnRevision: -1,
    mouse: { down: false, active: false, dragging: false, x: 0, y: 0, lastAt: 0, ndc: { x: 0, y: 0 } },
    lastRenderAt: 0, hidden: false, experienceVisible: true, contextLost: false, errors: {},
    diagnostics: { loaded: false, markerSources: {}, normalizedRadius: 0 }
  };
  const $ = id => document.getElementById(id);
  const math = GestureMath;
  let scene, renderer, camera, globeGroup, modelWrapper, markers = [], raycaster;
  let WORLD_X, WORLD_Y, FRONT, homeQuaternion, glowTexture;
  const labels = new Map();
  const viewport = { width: 1, height: 1 };
  function resizeExperience() {
    const rect = $('stage').getBoundingClientRect();
    viewport.width = Math.max(1, rect.width); viewport.height = Math.max(1, rect.height);
    if (!camera || !renderer) return;
    camera.aspect = viewport.width / viewport.height; camera.updateProjectionMatrix();
    renderer.setSize(viewport.width, viewport.height);
  }

  // 所有依赖均为经典非模块脚本：Three r128 与 examples/js 的 GLTFLoader 严格同版。
  function loadClassic(paths, test) {
    if (test()) return Promise.resolve();
    return new Promise((resolve, reject) => {
      let index = 0;
      function attempt() {
        if (index === paths.length) return reject(new Error('CDN 无法加载：' + paths[0]));
        const script = document.createElement('script');
        script.src = paths[index++]; script.async = false; script.crossOrigin = 'anonymous';
        const timeout = setTimeout(failed, 20000);
        function failed() { clearTimeout(timeout); script.onload = script.onerror = null; script.remove(); attempt(); }
        script.onload = () => { clearTimeout(timeout); if (test()) resolve(); else failed(); };
        script.onerror = failed;
        document.head.appendChild(script);
      }
      attempt();
    });
  }
  const cdn = path => ['https://cdn.jsdelivr.net/npm/' + path, 'https://unpkg.com/' + path];
  function setError(scope, message) {
    if (message) state.errors[scope] = message; else delete state.errors[scope];
    $('error').textContent = Object.values(state.errors).join('\n\n');
    $('error').hidden = !Object.keys(state.errors).length;
  }

  function initThree() {
    scene = new THREE.Scene(); scene.background = new THREE.Color(0xc7cfba);
    resizeExperience();
    camera = new THREE.PerspectiveCamera(40, viewport.width / viewport.height, 0.025, 100);
    camera.position.set(0, 0, CONFIG.homeDistance); camera.lookAt(0, 0, 0);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    renderer.setSize(viewport.width, viewport.height);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
    $('stage').appendChild(renderer.domElement);
    globeGroup = new THREE.Group(); globeGroup.name = 'GlobeInteractionRoot'; scene.add(globeGroup);
    homeQuaternion = globeGroup.quaternion.clone();
    WORLD_X = new THREE.Vector3(1, 0, 0); WORLD_Y = new THREE.Vector3(0, 1, 0); FRONT = new THREE.Vector3(0, 0, 1);
    raycaster = new THREE.Raycaster();
    scene.add(new THREE.AmbientLight(0xc1d4e6, 0.85));
    const key = new THREE.DirectionalLight(0xfff5e5, 1.5); key.position.set(4, 5, 5); scene.add(key);
    const fill = new THREE.DirectionalLight(0xa9cee3, 0.65); fill.position.set(-4, -2, -2); scene.add(fill);
    const stars = new Float32Array(650 * 3);
    for (let i = 0; i < 650; i++) {
      const z = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = 15 + Math.random() * 22;
      const s = Math.sqrt(1 - z * z); stars.set([r * s * Math.cos(a), r * z, r * s * Math.sin(a)], i * 3);
    }
    const starGeometry = new THREE.BufferGeometry(); starGeometry.setAttribute('position', new THREE.BufferAttribute(stars, 3));
    scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xb9cbd1, size: 0.023, transparent: true, opacity: 0.55, depthWrite: false })));
    renderer.domElement.addEventListener('webglcontextlost', event => { event.preventDefault(); state.contextLost = true; setError('webgl', '图形上下文已中断，正在等待恢复。'); });
    renderer.domElement.addEventListener('webglcontextrestored', () => { state.contextLost = false; setError('webgl', ''); });
    addEventListener('resize', resizeExperience);
    if (window.ResizeObserver) new ResizeObserver(resizeExperience).observe($('experience'));
    if (window.IntersectionObserver) {
      new IntersectionObserver(entries => {
        state.experienceVisible = entries[0].intersectionRatio > 0.55;
        if (!state.experienceVisible) {
          loseHand(); state.clicks.length = 0; state.mouse.down = false;
          state.velocity.x = state.velocity.y = 0;
          $('cursor').style.opacity = '0';
        }
      }, { threshold: [0, 0.55, 1] }).observe($('experience'));
    }
    installFallback();
    if(state.ready&&state.restoreSnapshot){const saved=state.restoreSnapshot;state.restoreSnapshot=null;if(Number.isFinite(saved.targetScale))state.scaleTarget=math.clamp(saved.targetScale,CONFIG.minScale,CONFIG.maxScale);const marker=markers.find(m=>m.userData.boardId===saved.selectedBoard);if(marker){state.restoringSnapshot=true;try{focusBoard(marker,performance.now());}finally{state.restoringSnapshot=false;}}}
    requestAnimationFrame(render);
  }

  // ==================== 模型加载 ====================
  function loadEarthModel() {
    $('loadingText').textContent = '正在加载 ./models/earth.glb…';
    const loader = new THREE.GLTFLoader();
    // 如将来换成 Draco 压缩 GLB，需要另加同版 DRACOLoader；当前提供的 GLB 未压缩。
    loader.load(CONFIG.modelURL, gltf => {
      try {
        const model = gltf.scene;
        model.updateMatrixWorld(true);
        const bounds = new THREE.Box3().setFromObject(model);
        const sphere = new THREE.Sphere(bounds.getCenter(new THREE.Vector3()), 0);
        // Box3 的对角线外接球会被云朵/树冠放大；使用各 Mesh 的真实 BoundingSphere。
        model.traverse(node => {
          if (!node.isMesh || !node.geometry) return;
          if (!node.geometry.boundingSphere) node.geometry.computeBoundingSphere();
          const meshSphere = node.geometry.boundingSphere.clone().applyMatrix4(node.matrixWorld);
          sphere.radius = Math.max(sphere.radius, sphere.center.distanceTo(meshSphere.center) + meshSphere.radius);
        });
        if (bounds.isEmpty() || !Number.isFinite(sphere.radius) || sphere.radius < 1e-8) throw new Error('模型为空或包围球半径无效。');
        // 只离线采样几何顶点估计球体主体半径，不做任何地球射线检测。
        const radii = [], samplePoint = new THREE.Vector3();
        model.traverse(node => {
          if (!node.isMesh || !node.geometry || radii.length >= 40000) return;
          const positions = node.geometry.getAttribute('position');
          if (!positions) return;
          const step = Math.max(1, Math.ceil(positions.count / 12000));
          for (let i = 0; i < positions.count && radii.length < 40000; i += step) {
            samplePoint.fromBufferAttribute(positions, i).applyMatrix4(node.matrixWorld);
            radii.push(samplePoint.distanceTo(sphere.center) / sphere.radius);
          }
        });
        radii.sort((a, b) => a - b);
        state.surfaceRadius = radii.length ? math.clamp(radii[Math.floor(radii.length * 0.2)] + CONFIG.markerLift, 0.35, 1) : 1.025;
        // 仅对新增的适配容器做一次平移与缩放，不触碰 GLB 内部节点变换或材质。
        modelWrapper = new THREE.Group(); modelWrapper.name = 'StaticModelNormalization';
        modelWrapper.scale.setScalar(1 / sphere.radius);
        modelWrapper.position.copy(sphere.center).multiplyScalar(-1 / sphere.radius);
        modelWrapper.add(model); globeGroup.add(modelWrapper);
        globeGroup.updateMatrixWorld(true);
        createBoardMarkers(model);
        // 以亚洲交互点为默认正面，同时保留北向朝上的方向。
        const asiaMarker=markers.find(marker=>marker.userData.boardId==='asia');
        if(asiaMarker) {
          const direction=asiaMarker.position.clone().normalize();
          const longitude=Math.atan2(direction.x,direction.z), latitude=Math.asin(direction.y);
          homeQuaternion=new THREE.Quaternion().setFromAxisAngle(WORLD_X,latitude).multiply(new THREE.Quaternion().setFromAxisAngle(WORLD_Y,-longitude));
          globeGroup.quaternion.copy(homeQuaternion);
          globeGroup.updateMatrixWorld(true);
        }
        state.ready = true; state.diagnostics.loaded = true; state.diagnostics.normalizedRadius = 1;
        $('loading').hidden = true; setError('model', '');
      } catch (error) { modelFailed(error); }
    }, event => {
      $('loadingText').textContent = event.total ? '正在加载地球模型 ' + Math.round(event.loaded / event.total * 100) + '%' : '正在加载地球模型 ' + (event.loaded / 1048576).toFixed(1) + ' MB';
    }, modelFailed);
  }
  function modelFailed(error) {
    console.error('[模型加载失败]', error); $('loading').hidden = true;
    setError('model', '地球模型加载失败：' + CONFIG.modelURL + '\n请确认 models/earth.glb 存在，并通过 http://localhost 启动。\n详情：' + (error.message || error.statusText || '文件不存在、格式不支持或网络请求失败。'));
  }
  function latLonToVector(lat, lon, radius) {
    const a = THREE.MathUtils.degToRad(lat), b = THREE.MathUtils.degToRad(lon + CONFIG.longitudeOffset);
    return new THREE.Vector3(Math.cos(a) * Math.sin(b), Math.sin(a), Math.cos(a) * Math.cos(b)).multiplyScalar(radius);
  }
  function makeGlowTexture() {
    // 只为交互点创建程序化 CanvasTexture；从不生成或替换地球纹理。
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = 96;
    const ctx = canvas.getContext('2d'), gradient = ctx.createRadialGradient(48, 48, 0, 48, 48, 48);
    gradient.addColorStop(0, '#ffffff'); gradient.addColorStop(0.16, '#e0ffef');
    gradient.addColorStop(0.34, '#8ae7cbb8'); gradient.addColorStop(1, '#8ae7cb00');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, 96, 96);
    return new THREE.CanvasTexture(canvas);
  }
  function createBoardMarkers(model) {
    glowTexture = makeGlowTexture();
    const normalizedName = value => value.toLowerCase().replace(/[\s_\-.]/g, '');
    const nodesByName = new Map();
    model.traverse(node => { if (node.name) nodesByName.set(normalizedName(node.name), node); });
    for (const board of BOARDS) {
      const node = board.aliases.map(name => nodesByName.get(normalizedName(name))).find(Boolean);

  function clearDwell() {
    state.dwell = { anchor: null, frames: 0, started: 0, latched: false, progress: 0 };

  function pickMarker(ndc) {

    const hit = raycaster.intersectObjects(markers.filter(marker => marker.visible), false)[0];

  }

  function focusBoard(marker, now) {
    const direction = marker.getWorldPosition(new THREE.Vector3()).normalize();
    const delta = new THREE.Quaternion().setFromUnitVectors(direction, FRONT);
    const targetQuaternion = delta.multiply(globeGroup.quaternion.clone()).normalize();
    state.velocity.x = state.velocity.y = state.targetVelocity.x = state.targetVelocity.y = 0;
    state.view.selectedBoard = marker.userData.boardId;
    state.ui.entered=false;state.ui.enterRequested=false;state.ui.grab={phase:0,hold:0,deadline:0,fire:false};
    state.view.transition = { started: now, duration: 850, from: globeGroup.quaternion.clone(), to: targetQuaternion };

    features: { title: '网站核心功能', html: '<ul><li><strong>自由旋转：</strong>张开手掌轻移，观察地球的不同方向；靠近摄像头时旋转更灵敏。</li><li><strong>整体缩放：</strong>两只手同时放入画面，双手分开放大，靠拢缩小。</li><li><strong>大陆聚焦：</strong>仅伸食指，对准大陆光点稳定停留，进入板块观察。</li><li><strong>内容阅读：</strong>点击底部标题，或用食指指向标题并停留，打开介绍弹窗。</li><li><strong>返回视图：</strong>做 OK 手势关闭弹窗；在地球视图中可用 OK 手势或右上角按钮恢复全局视角。</li></ul>' }

  const DEMOS = [
    ['张掌旋转', '张开手掌，向左右或上下轻移。手离摄像头越近，旋转越灵敏。'],
    ['双手缩放', '将两只手放入画面，向两侧分开放大，向中间靠拢缩小。单手时可旋转或指向选中。'],
    ['食指选中', '只伸食指，对准大陆光点或下方标题，稳定停留约 0.6 秒即可选中。'],

  ];
  function stopMotion() { state.ui.scrollTarget=state.ui.scrollVelocity=0; state.velocity.x = state.velocity.y = state.targetVelocity.x = state.targetVelocity.y = 0; state.zoomStartGap = null; state.mouse.down = false; state.clicks.length = 0; clearDwell(); }
  function finishTutorial() { if(sharedCamera)window.parent.postMessage({type:'herbal-world-progress'},location.origin);state.ui.tutorial = false; $('tutorial').hidden = true; stopMotion(); state.cooldownUntil = performance.now() + 900; $('reset').focus(); }
  function openInfo(id) { const data = INFO[id]; if (!data) return; $('info-modal').classList.toggle('research-modal',id==='background'); state.ui.previousFocus = document.activeElement; state.ui.modal = id; $('info-title').textContent = data.title; $('info-content').innerHTML = data.html; $('info-modal').hidden = false; $('info-modal').querySelector('.info-card').scrollTop=0; stopMotion(); $('close-info').focus(); }
  function closeInfo() { state.ui.modal = null; $('info-modal').hidden = true; stopMotion(); state.cooldownUntil = performance.now() + 900; if (state.ui.previousFocus) state.ui.previousFocus.focus(); }
  document.querySelectorAll('.info-trigger').forEach(button => button.addEventListener('click', () => openInfo(button.dataset.info)));
  $('close-info').addEventListener('click', closeInfo); $('skip-tutorial').addEventListener('click', finishTutorial);
  $('info-modal').addEventListener('click', e => { if (e.target === $('info-modal')) closeInfo(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') { if (state.ui.modal) closeInfo(); else if (state.ui.tutorial) finishTutorial(); } if (e.key === 'Tab' && (state.ui.modal || state.ui.tutorial)) { e.preventDefault(); (state.ui.modal ? $('close-info') : $('skip-tutorial')).focus(); } });
  function uiTarget(tip) {
    if (!tip) return null;
    const host = $('experience').getBoundingClientRect(), x = host.left + tip.x * host.width, y = host.top + tip.y * host.height;
    const candidates = state.ui.tutorial ? [$('skip-tutorial')] : state.ui.modal ? [$('close-info')] : (state.view.selectedBoard && !state.ui.entered && !$('continent-entry').hidden ? [$('continent-entry'),$('continent-back')] : []);

  }
  function drawCameraFeedback() {
    const video = $('video'), canvas = $('skeleton'), ctx = canvas.getContext('2d');
    if (!state.camera.running || video.readyState < 2) return;
    // <video> 显示实际画面；透明 canvas 只画骨架，父容器同时镜像二者。
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!state.handPresent || !state.latestResults) return;
    for (const landmarks of state.latestResults.multiHandLandmarks || []) {
    if (landmarks && window.drawConnectors && window.HAND_CONNECTIONS) {
      drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: '#a7dfd3', lineWidth: 2 });
      drawLandmarks(ctx, landmarks, { color: '#e5f1ca', fillColor: '#daeac6', lineWidth: 1, radius: 2 });
      const pc=[0,5,9,13,17].reduce((v,i)=>({x:v.x+landmarks[i].x/5,y:v.y+landmarks[i].y/5}),{x:0,y:0});
      ctx.beginPath();ctx.arc(pc.x*canvas.width,pc.y*canvas.height,12,0,Math.PI*2);ctx.fillStyle=math.classify(landmarks).fist?'#ffb548':'#faffef';ctx.fill();ctx.strokeStyle='#355e41';ctx.lineWidth=4;ctx.stroke();
    }
    }
  }

  // ==================== 旋转 / 缩放 / 板块动画的唯一渲染出口 ====================
  function render(now) {
    requestAnimationFrame(render);
    const dt = Math.min(0.05, Math.max(0.001, (now - (state.lastRenderAt || now - 16.67)) / 1000)); state.lastRenderAt = now;
    if (state.hidden || !state.experienceVisible || state.contextLost) return;
    if (state.handPresent && now - state.lastHandAt > CONFIG.handTimeout) loseHand();
    updateUI(now,dt);
    const mouseDriving = !state.handPresent && state.mouse.down;
    if (state.handPresent || mouseDriving) {
      const follow = math.alpha(state.handMode === 'rotate' || mouseDriving ? 13 : 20, dt);
      state.velocity.x = math.lerp(state.velocity.x, state.targetVelocity.x, follow);
      state.velocity.y = math.lerp(state.velocity.y, state.targetVelocity.y, follow);
    } else {
      const decay = Math.exp(-3.8 * dt); state.velocity.x *= decay; state.velocity.y *= decay;
    }
    if (Math.abs(state.velocity.x) < 0.0001) state.velocity.x = 0;
    if (Math.abs(state.velocity.y) < 0.0001) state.velocity.y = 0;
    if (state.view.transition) {
      const t = math.clamp((now - state.view.transition.started) / state.view.transition.duration, 0, 1);
      const eased = t * t * (3 - 2 * t);
      globeGroup.quaternion.copy(state.view.transition.from).slerp(state.view.transition.to, eased);
      if (t >= 1) { state.view.transition = null; state.palm = null; state.lastSampleAt = 0; }
    } else {
      // globeGroup 直属未旋转的 Scene；固定相机沿 +Z，世界 X/Y 即屏幕 X/Y。
      globeGroup.rotateOnWorldAxis(WORLD_Y, state.velocity.y * dt);
      globeGroup.rotateOnWorldAxis(WORLD_X, state.velocity.x * dt);
    }
    // 60 FPS 时系数约 0.2；改写为与帧率无关的平滑系数。
    const zoomAlpha = 1 - Math.pow(0.8, dt * 60);
    state.scale = math.lerp(state.scale, math.clamp(state.scaleTarget, CONFIG.minScale, CONFIG.maxScale), zoomAlpha);
    globeGroup.scale.setScalar(state.scale);
    state.view.distance = math.lerp(state.view.distance, state.view.targetDistance, math.alpha(5.5, dt));
    // 仅安全约束防相机进入模型，不回写缩放目标，也不取消板块推近状态。
    camera.position.set(0, 0, Math.max(state.view.distance, state.scale * 1.28 + camera.near * 3)); camera.lookAt(0, 0, 0);
    scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);
    updateMarkers(now);
    updateContinentOverlay(now);
    let queued;
    while ((queued = state.clicks.shift())) {
      if (!state.ready || state.view.transition || now - queued.at > 500) continue;
      if (queued.tip) {
        const target = uiTarget(queued.tip);
        if (target) { if(target.id!=='continent-entry')target.click(); continue; }
        const rect = $('stage').getBoundingClientRect(), host = $('experience').getBoundingClientRect();
        queued.x = ((host.left + queued.tip.x*host.width - rect.left)/rect.width)*2-1;
        queued.y = 1-((host.top + queued.tip.y*host.height - rect.top)/rect.height)*2;
      }
      if (state.ui.modal || state.ui.tutorial) continue;
      const marker = pickMarker(queued); if (marker) focusBoard(marker, now);
    }
    updateFeedback(now);
    renderer.render(scene, camera);
    scheduleInference(now);
  }
  function updateMarkers(now) {
    if (!state.ready) return;
    const localCamera = globeGroup.worldToLocal(camera.position.clone());
    for (const marker of markers) {
      // depthTest:false 避免表面遮挡，同时显式屏蔽背面点，防止点穿地球。
      const towardCamera = localCamera.clone().sub(marker.position);
      marker.visible = marker.position.clone().normalize().dot(towardCamera) > 0.06;
      const label = labels.get(marker);
      const projected = marker.getWorldPosition(new THREE.Vector3()).project(camera);
      const inFrame = marker.visible && projected.z > -1 && projected.z < 1 && Math.abs(projected.x) < 1.05 && Math.abs(projected.y) < 1.05;
      label.hidden = !inFrame;
      if (inFrame) { label.style.left = ((projected.x + 1) * viewport.width / 2) + 'px'; label.style.top = ((1 - projected.y) * viewport.height / 2) + 'px'; }
      const active = state.ui.markerHover === marker || state.view.selectedBoard === marker.userData.boardId;
      marker.material.color.setHex(active ? 0xff8a30 : 0xb9ffdf);
      marker.scale.set(active ? .21 : .14,active ? .21 : .14,1);
      label.classList.toggle('selected',active);
      marker.material.opacity = active ? 1 : 0.78 + 0.16 * Math.sin(now * 0.002 + marker.id);
    }
  }
  function updateFeedback(now) {
    const palmCursor=$('palm-cursor');
    const showPalm=state.handPresent && state.handCount===1 && !!state.palmPointer && !state.ui.tutorial && state.handMode!=='point';
    palmCursor.style.opacity=showPalm?'1':'0';
    if(showPalm){
      const p=state.palmPointer,progress=state.ui.grab.progress||0;
      palmCursor.style.left=p.x*$('experience').clientWidth+'px';palmCursor.style.top=p.y*$('experience').clientHeight+'px';
      palmCursor.classList.toggle('recognized',state.fistDetected);
      palmCursor.querySelector('.palm-progress').style.strokeDashoffset=String(163.36*(1-progress));
      $('palm-status').textContent=state.ui.grab.phase===1?'握拳中 '+(progress*.5).toFixed(1)+' / 0.5 秒':state.ui.entered?'已进入':state.fistDetected?(state.view.selectedBoard?'已识别握拳 · 移向入口':'已识别握拳'):(state.view.selectedBoard?'掌心对准圆圈 · 握拳进入':'已识别掌心');
    }
    const pointing = state.handPresent && state.handMode === 'point' && !state.view.transition;
    if (!pointing) { state.ui.markerHover=null; $('cursor').classList.remove('on-target'); }
    $('cursor').style.opacity = pointing ? '1' : '0';
    if (pointing && state.tip) {
      $('cursor').style.left = state.tip.x * $('experience').clientWidth + 'px'; $('cursor').style.top = state.tip.y * $('experience').clientHeight + 'px';
      $('cursor').querySelector('.progress').style.strokeDashoffset = String(101 * (1 - state.dwell.progress));
      const host = $('experience'), correctedNDC = { x: state.tip.x*2-1, y: 1-state.tip.y*host.clientHeight/viewport.height*2 };
      const hit = state.ready && !state.ui.modal && !state.ui.tutorial ? pickMarker(correctedNDC) : null;
      state.ui.markerHover=hit;
      $('cursor').classList.toggle('on-target',!!(hit || state.ui.hover));
      $('cursorName').textContent = state.ui.hover ? state.ui.hover.textContent : hit ? hit.userData.name : '';
    }
    const modes = { grab: '对准入口 · 握拳保持半秒进入', scroll: '张掌上下滑动阅读 · OK 返回', ok: 'OK 手势 · 保持片刻返回', rotate: '张掌旋转 · 靠近镜头转得更快', zoom: '双手分开放大 · 靠拢缩小', point: '食指指向光点 · 停留选中大洲', brake: '静止观察', none: '张开手掌开始互动' };
    $('mode').textContent = state.view.transition ? '正在切换视角…' : modes[state.handMode];
    if (state.camera.running) $('cameraStatus').textContent = state.handPresent ? state.handCount === 2 ? '已识别双手 · 分开放大，靠拢缩小' : '已识别单手 · 可旋转或食指选中' : '摄像头已开启 · 将手放入画面';
    if (state.drawnRevision !== state.resultsRevision || !state.handPresent) { drawCameraFeedback(); state.drawnRevision = state.resultsRevision; }
  }

  // 轻量备用交互：无 OrbitControls，手势检测到时自动让位。
  function installFallback() {
    const element = renderer.domElement;
    element.addEventListener('pointerdown', event => {
      if (state.ui.tutorial || state.ui.modal || state.handPresent || state.view.transition || event.button !== 0) return;
      state.mouse = { down: true, active: true, dragging: false, x: event.clientX, y: event.clientY, lastAt: performance.now(), ndc: { x: 0, y: 0 } };
      state.targetVelocity.x = state.targetVelocity.y = 0; element.setPointerCapture(event.pointerId);
    });
    element.addEventListener('pointermove', event => {
      if (state.handPresent || !state.mouse.down) return;
      const now = performance.now(), dx = event.clientX - state.mouse.x, dy = event.clientY - state.mouse.y;
      const dt = Math.max(1 / 120, (now - state.mouse.lastAt) / 1000);
      if (Math.hypot(dx, dy) > 2) state.mouse.dragging = true;
      state.targetVelocity.y = math.clamp(dx / viewport.width / dt * 4 / state.scale, -2.8, 2.8);
      state.targetVelocity.x = math.clamp(dy / viewport.height / dt * 4 / state.scale, -2.8, 2.8);
      state.mouse.x = event.clientX; state.mouse.y = event.clientY; state.mouse.lastAt = now;
    });
    element.addEventListener('pointerup', event => {
      if (!state.mouse.down) return;
      const wasClick = !state.mouse.dragging; state.mouse.down = false;
      const rect = element.getBoundingClientRect();
      if (!state.handPresent && wasClick) state.clicks.push({ x: (event.clientX - rect.left) / rect.width * 2 - 1, y: 1 - (event.clientY - rect.top) / rect.height * 2, at: performance.now() });
      state.targetVelocity.x = state.targetVelocity.y = 0;
      if (element.hasPointerCapture(event.pointerId)) element.releasePointerCapture(event.pointerId);
    });
    element.addEventListener('pointercancel', () => { state.mouse.down = false; state.targetVelocity.x = state.targetVelocity.y = 0; });
    element.addEventListener('wheel', event => {
      // 普通滚轮用于阅读下方介绍；Ctrl+滚轮保留备用缩放。
      if (!event.ctrlKey) return;
      event.preventDefault(); if (state.handPresent || state.view.transition) return;
      state.scaleTarget = math.clamp(state.scaleTarget * Math.exp(-event.deltaY * 0.001), CONFIG.minScale, CONFIG.maxScale);
    }, { passive: false });
  }
  addEventListener('visibilitychange', () => { state.hidden = document.hidden; loseHand(); state.mouse.down = false; });
  addEventListener('pagehide', () => {
    state.camera.session++; state.camera.running = false;
    if (state.camera.helper) state.camera.helper.stop();
    const stream = $('video').srcObject; if (stream&&!sharedCamera) stream.getTracks().forEach(track => track.stop());
    if (state.camera.hands) state.camera.hands.close().catch(() => {});
  });

  // 只读诊断便于接入时检查；业务 API 为 resetView / onBoardSelected / boardselected。
  window.getEarthStatus = () => ({ ready: state.ready, mode: state.handMode, scale: state.scale, targetScale: state.scaleTarget, velocity: { ...state.velocity }, selectedBoard: state.view.selectedBoard, distance: camera ? camera.position.z : null, diagnostics: JSON.parse(JSON.stringify(state.diagnostics)) });
  async function boot() {
    try {
      await loadClassic(cdn('three@0.128.0/build/three.min.js'), () => !!window.THREE);
      await loadClassic(cdn('three@0.128.0/examples/js/loaders/GLTFLoader.js'), () => !!(window.THREE && THREE.GLTFLoader));
      initThree();
      const manifest=await fetch('./models/manifest.json').then(r=>{if(!r.ok)throw Error('地球模型清单加载失败');return r.json();});
      const chunks=await Promise.all(manifest.parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw Error('地球模型分片加载失败');return r.arrayBuffer();})));
      const blob=new Blob(chunks,{type:'model/gltf-binary'});if(blob.size!==manifest.bytes)throw Error('地球模型不完整');
      CONFIG.modelURL=URL.createObjectURL(blob);loadEarthModel();
      initTracking().catch(cameraFailed);
    } catch (error) {
      console.error(error); $('loading').hidden = true;
      setError('startup', '页面初始化失败：' + error.message + '\n请检查网络能否访问 CDN、浏览器是否支持 WebGL，以及是否通过本地 HTTP 服务器运行。');
    }
  }
  boot();
  </script>
</body>
</html>
